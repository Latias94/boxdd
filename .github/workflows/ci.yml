name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  compiler-baseline:
    name: Compiler Baseline (Rust 1.95)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Install verification nightly
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-05-27
          components: miri, rust-src

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify compiler policy
        shell: bash
        run: |
          set -euo pipefail
          rustup component list --toolchain nightly-2026-05-27 | grep -Eq '^miri-.*\(installed\)$'
          rustup component list --toolchain nightly-2026-05-27 | grep -Eq '^rust-src .?\(installed\)$|^rust-src-.*\(installed\)$'
          cargo +1.95.0 run -p xtask -- verify-toolchains

      - name: Check workspace at MSRV
        run: |
          cargo +1.95.0 check --workspace --all-targets
          cargo +1.95.0 check -p boxdd --all-targets --all-features

      - name: Test system-link provider at MSRV
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=target/msrv-source cargo +1.95.0 build -p boxdd-sys --quiet
          LIB="$(find target/msrv-source/debug/build -name libbox2d.a -type f -print -quit)"
          test -n "$LIB"
          SYS_DIR="$(mktemp -d)"
          cp "$LIB" "$SYS_DIR/"
          BOX2D_LIB_DIR="$SYS_DIR" BOXDD_SYS_LINK_KIND=static CARGO_TARGET_DIR=target/msrv-system cargo +1.95.0 test -p boxdd --quiet

      - name: Build prebuilt package at MSRV
        env:
          CARGO_TARGET_DIR: target/msrv-package
          BOXDD_SYS_PACKAGE_DIR: ${{ runner.temp }}/boxdd-msrv-packages
        run: cargo +1.95.0 run -p boxdd-sys --features package-bin --bin package --release

  lint:
    name: Lint + Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: |
          # `boxdd-sys` keeps `bindgen` behind an optional feature to avoid requiring libclang.
          cargo clippy -p boxdd-sys --all-targets -- -D warnings
          cargo clippy -p boxdd --all-targets --all-features -- -D warnings
          cargo clippy -p bevy_boxdd --all-targets --no-default-features -- -D warnings

      - name: upstream accounting checks
        run: |
          cargo run -p xtask -- upstream-sync --check
          cargo run -p xtask -- api-coverage --check
          cargo run -p xtask -- sample-parity --check
          cargo run -p xtask -- validate-pages

      - name: tests (core)
        run: |
          cargo nextest run -p boxdd
          cargo nextest run -p boxdd-sys --test layout
          cargo nextest run -p bevy_boxdd --test plugin
          cargo nextest run -p boxdd --features serialize
          cargo nextest run -p boxdd --features unchecked
          cargo nextest run -p boxdd --features mint
          cargo nextest run -p boxdd --features bytemuck
          cargo nextest run -p boxdd --features cgmath
          cargo nextest run -p boxdd --features nalgebra
          cargo nextest run -p boxdd --features glam
          cargo nextest run -p boxdd --features "bytemuck glam"

      - name: examples smoke
        run: |
          cargo run -p boxdd --example dynamic_tree

      - name: system-link smoke (BOX2D_LIB_DIR)
        shell: bash
        run: |
          set -euxo pipefail
          # Build from source once to get a libbox2d.a, then rebuild in "system link" mode.
          cargo build -p boxdd-sys --quiet
          LIB="$(ls target/debug/build/boxdd-sys-*/out/libbox2d.a | head -n 1)"
          SYS_DIR="$(mktemp -d)"
          cp "$LIB" "$SYS_DIR/"
          cargo clean -p boxdd-sys
          BOX2D_LIB_DIR="$SYS_DIR" BOXDD_SYS_LINK_KIND=static cargo test -p boxdd --quiet

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets --verbose

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs
        run: cargo doc --no-deps --workspace

      - name: Docs (docs.rs offline mode)
        env:
          DOCS_RS: "1"
        run: |
          # Verify docs build path that skips native C build and uses pregenerated bindings
          cargo doc -p boxdd-sys --no-deps

  features:
    name: Feature Matrix (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.95.0", "1.97.0"]
        features: [
          "",
          "serde",
          "serialize",
          "cgmath",
          "nalgebra",
          "glam",
          "bytemuck",
          "bytemuck glam",
          "serde cgmath nalgebra",
          "serde glam",
          "serde bytemuck",
          "serde bytemuck glam",
          "serialize glam",
          "serialize bytemuck",
          "serialize bytemuck glam",
          "serialize cgmath nalgebra",
        ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo check (boxdd with features="${{ matrix.features }}")
        shell: bash
        run: |
          set -euxo pipefail
          FEATS='${{ matrix.features }}'
          if [ -z "$FEATS" ]; then
            cargo +${{ matrix.toolchain }} check -p boxdd --quiet
          else
            cargo +${{ matrix.toolchain }} check -p boxdd --features "$FEATS" --quiet
          fi

  wasm:
    name: WASM Checks (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.95.0", "1.97.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Add wasm targets
        run: |
          rustup target add --toolchain ${{ matrix.toolchain }} wasm32-unknown-unknown
          rustup target add --toolchain ${{ matrix.toolchain }} wasm32-wasip1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo check (boxdd-sys, wasm32-unknown-unknown)
        run: |
          cargo +${{ matrix.toolchain }} check -p boxdd-sys --target wasm32-unknown-unknown --quiet

      - name: cargo check (boxdd-sys, wasm32-wasip1)
        run: |
          cargo +${{ matrix.toolchain }} check -p boxdd-sys --target wasm32-wasip1 --quiet

  wasm-strict:
    name: WASM Strict Bindings (Rust ${{ matrix.toolchain }}, conditional)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.95.0", "1.97.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Add wasm targets
        run: |
          rustup target add --toolchain ${{ matrix.toolchain }} wasm32-unknown-unknown
          rustup target add --toolchain ${{ matrix.toolchain }} wasm32-wasip1

      - name: Strict check (only if pregenerated or sysroot present)
        env:
          BOXDD_SYS_STRICT_WASM_BINDINGS: "1"
        shell: bash
        run: |
          set -euo pipefail
          has_pregen="$(test -f boxdd-sys/src/wasm_bindings_pregenerated.rs && echo yes || echo no)"
          if [ "$has_pregen" = "yes" ] || [ -n "${WASI_SDK_PATH:-}" ] || [ -n "${EMSDK:-}" ]; then
            echo "Strict mode enabled with available wasm bindings/sysroot; running checks."
            cargo +${{ matrix.toolchain }} check -p boxdd-sys --target wasm32-unknown-unknown --quiet || exit 1
            cargo +${{ matrix.toolchain }} check -p boxdd-sys --target wasm32-wasip1 --quiet || exit 1
          else
            echo "Skipping strict wasm checks (no pregenerated bindings and no sysroot configured)."
          fi
